<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Gradient for left-to-right fade across the banner -->
    <linearGradient id="capsuleGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38B6FF" stop-opacity="0.82" />
      <stop offset="25%" stop-color="#52C1E4" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#8EDCF5" stop-opacity="0.38" />
      <stop offset="80%" stop-color="#C2EFFC" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#E8F8FE" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="dotGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38B6FF" stop-opacity="0.75" />
      <stop offset="25%" stop-color="#52C1E4" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#99E0F6" stop-opacity="0.30" />
      <stop offset="85%" stop-color="#D2F4FD" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- White pill highlight circle inside capsules -->
    <linearGradient id="whiteHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10" />
    </linearGradient>
  </defs>

  <g fill="none">
    <!-- ROW 1 (y = 42, height = 36) -->
    <!-- Dot 1 -->
    <circle cx="35" cy="42" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 1 -->
    <rect x="95" y="24" width="160" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="113" cy="42" r="14" fill="url(#whiteHighlight)" />
    <!-- Dot 2 -->
    <circle cx="310" cy="42" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 2 -->
    <rect x="370" y="24" width="180" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="532" cy="42" r="14" fill="url(#whiteHighlight)" />
    <!-- Dot 3 -->
    <circle cx="610" cy="42" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 3 (fading light on right) -->
    <rect x="670" y="24" width="190" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <!-- Faded Dot 4 -->
    <circle cx="910" cy="42" r="18" fill="url(#dotGrad1)" />

    <!-- ROW 2 (y = 126, height = 36, staggered) -->
    <!-- Capsule 1 (starts at edge) -->
    <rect x="-20" y="108" width="150" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="112" cy="126" r="14" fill="url(#whiteHighlight)" />
    <!-- Dot 1 -->
    <circle cx="185" cy="126" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 2 -->
    <rect x="250" y="108" width="190" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="268" cy="126" r="14" fill="url(#whiteHighlight)" />
    <!-- Dot 2 -->
    <circle cx="495" cy="126" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 3 -->
    <rect x="560" y="108" width="170" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="712" cy="126" r="14" fill="url(#whiteHighlight)" />
    <!-- Faded Dot 3 -->
    <circle cx="785" cy="126" r="18" fill="url(#dotGrad1)" />
    <!-- Faded Capsule 4 -->
    <rect x="840" y="108" width="160" height="36" rx="18" fill="url(#capsuleGrad1)" />

    <!-- ROW 3 (y = 210, height = 36) -->
    <!-- Dot 1 -->
    <circle cx="55" cy="210" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 1 -->
    <rect x="115" y="192" width="175" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="272" cy="210" r="14" fill="url(#whiteHighlight)" />
    <!-- Dot 2 -->
    <circle cx="340" cy="210" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 2 -->
    <rect x="405" y="192" width="180" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="423" cy="210" r="14" fill="url(#whiteHighlight)" />
    <!-- Dot 3 -->
    <circle cx="640" cy="210" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 3 -->
    <rect x="705" y="192" width="165" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="852" cy="210" r="14" fill="url(#whiteHighlight)" />
    <!-- Faded Dot 4 -->
    <circle cx="925" cy="210" r="18" fill="url(#dotGrad1)" />

    <!-- ROW 4 (y = 294, height = 36, staggered) -->
    <!-- Capsule 1 -->
    <rect x="-10" y="276" width="160" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="132" cy="294" r="14" fill="url(#whiteHighlight)" />
    <!-- Dot 1 -->
    <circle cx="205" cy="294" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 2 -->
    <rect x="270" y="276" width="190" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="288" cy="294" r="14" fill="url(#whiteHighlight)" />
    <!-- Dot 2 -->
    <circle cx="510" cy="294" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 3 -->
    <rect x="580" y="276" width="175" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <circle cx="737" cy="294" r="14" fill="url(#whiteHighlight)" />
    <!-- Faded Dot 3 -->
    <circle cx="810" cy="294" r="18" fill="url(#dotGrad1)" />
    <!-- Faded Capsule 4 -->
    <rect x="870" y="276" width="150" height="36" rx="18" fill="url(#capsuleGrad1)" />

    <!-- ROW 5 (y = 360, bottom edge accent) -->
    <!-- Dot 1 -->
    <circle cx="80" cy="360" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 1 -->
    <rect x="145" y="342" width="170" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <!-- Dot 2 -->
    <circle cx="365" cy="360" r="18" fill="url(#dotGrad1)" />
    <!-- Capsule 2 -->
    <rect x="430" y="342" width="180" height="36" rx="18" fill="url(#capsuleGrad1)" />
    <!-- Dot 3 -->
    <circle cx="660" cy="360" r="18" fill="url(#dotGrad1)" />
    <!-- Faded Capsule 3 -->
    <rect x="725" y="342" width="160" height="36" rx="18" fill="url(#capsuleGrad1)" />
  </g>
</svg>
