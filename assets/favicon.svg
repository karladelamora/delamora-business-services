<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#003680"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#52C1E4" stroke-width="8" opacity="0.8"/>

  <!-- DLM Typography -->
  <g filter="url(#shadow)">
    <text x="256" y="295" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, Arial, sans-serif" 
          font-size="190" 
          font-weight="900" 
          letter-spacing="-6" 
          fill="#FFFFFF" 
          text-anchor="middle">DLM</text>
  </g>

  <!-- 3 Signature Core Pillar Pills -->
  <circle cx="176" cy="385" r="24" fill="#F1B808"/>
  <circle cx="256" cy="385" r="24" fill="#52C1E4"/>
  <circle cx="336" cy="385" r="24" fill="#E87E1E"/>
</svg>
